      - "--purge removes soft-deleted Key Vaults and AI resources"
      - "--force skips the interactive confirmation"
      - "Verify the resource group is gone in the portal"
    notes: "Always demo teardown live. A workshop without teardown is a billing time-bomb. (Skip on the shared rg-dev-001 if it must persist.)"

