      - "2 · Transaction Search → end-to-end waterfall"
      - "3 · Application Map → click the SQL node"
      - "4 · Failures → drill to an exception → create a work item"
      - "5 · Logs (KQL) → workbook → an alert"
    notes: "DEMO master checklist for the hour. Keep traffic flowing throughout. Use scripts/open-monitoring-dashboard.ps1 to jump straight to the resource."

  # ───────────────────── PART G — Ops, cost, teardown, close ─────────────────────

  - key: cost-controls
    title: "Cost controls — no surprises"
    bullets:
      - "Daily cap on the App Insights resource for the workshop"
      - "Sampling: 100% in dev, 10–25% typical in prod"
      - "Workspace-based AI uses Log Analytics commitment tiers"
      - "Right-size the App Service plan; scale in when idle"
      - "Tag everything for billing slices"
    notes: "Tie cost back to the scaling and sampling levers shown earlier. The daily cap protects the subscription."

  - key: troubleshooting
    title: "Troubleshooting checklist"
    bullets:
      - "No telemetry? Verify APPLICATIONINSIGHTS_CONNECTION_STRING in App settings"
      - "Identity ingestion failing? Check AZURE_CLIENT_ID + AUTHENTICATION_STRING + role assignment"
      - "Container won't start? Confirm WEBSITES_PORT and the image tag in Deployment Center"
      - "Browser pageViews missing? Snippet must load before other scripts"
      - "SQL deps missing? EF Core needs the AI SDK — package alone is not enough"
    notes: "Keep this slide visible during labs. Most questions map to one of these lines. The identity line is specific to how rg-dev-001 is configured."

  - key: teardown
    title: "Teardown"
    bullets:
