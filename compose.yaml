services:
  api:
    build: { context: ., dockerfile: src/Mapaq.Api/Dockerfile }
    ports: ["5020:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Forwarded from the host shell by start-local.ps1 (resolved from azd) so
      # telemetry reaches the real App Insights resource; empty -> placeholder.
      ApplicationInsights__ConnectionString: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # omit ConnectionStrings__MapaqSql to use EF InMemory fallback
  web:
    build: { context: ., dockerfile: src/Mapaq.Web/Dockerfile }
    ports: ["5010:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MapaqApi__BaseAddress: http://api:8080/
      ApplicationInsights__ConnectionString: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    depends_on: [api]
