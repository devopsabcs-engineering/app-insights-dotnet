# Playwright UI tests against the deployed Mapaq.Web App Service.
# Mirrors .azuredevops/pipelines/ui-tests.yml.
#
# Defaults to the workshop-dev environment (rg-dev-001) and discovers the public
# Web URL at run time, so attendees do not have to memorize the resourceToken-
# suffixed hostname. Override webUrl (or azureEnvName) at dispatch time to retarget.
#
# Outputs:
#   * GitHub Checks tab — Playwright JUnit XML, one row per test (EnricoMi publish).
#   * Workflow artifact `ui-test-report` — playwright-report/ + screenshots + raw test-results.
#
# Note: the ADO pipeline also publishes screenshots to the project wiki via PAT.
# That step is intentionally omitted here — artifact + Checks summary are the
# GitHub-native equivalents, and a wiki commit step adds repo churn and PAT scope
# that has no clear consumer on GitHub today.
name: ui-tests

on:
  workflow_dispatch:
    inputs:
      azureEnvName:
        description: "azd environment name (resource group rg-<name>)"
        required: false
        type: string
        default: "dev-001"
      webUrl:
        description: 'Web base URL (use "auto" to discover from rg-<azureEnvName>)'
        required: false
        type: string
        default: "auto"
      failOnTestErrors:
        description: "Fail the workflow when any UI test fails"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

jobs:
  ui_tests:
    name: Run Playwright against deployed Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: workshop-dev
    env:
      NODE_VERSION: "20.x"
      REPORT_DIR: ${{ github.workspace }}/ui-test-report
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Web URL from rg-${{ inputs.azureEnvName }}
        env:
          AZ_ENV: ${{ inputs.azureEnvName }}
          WEB_URL_PARAM: ${{ inputs.webUrl }}
        run: |
          set -euo pipefail
          RG="rg-${AZ_ENV}"

          if [[ -n "$WEB_URL_PARAM" && "$WEB_URL_PARAM" != "auto" ]]; then
            RESOLVED_WEB="$WEB_URL_PARAM"
          else
            HOSTNAME="$(az webapp list \
                --resource-group "$RG" \
                --query "[?starts_with(name, 'mapaq-web-')].defaultHostName | [0]" \
                -o tsv)"
            if [[ -z "$HOSTNAME" ]]; then
              echo "::error::Could not resolve Web URL from $RG. Pass webUrl explicitly."
              exit 1
            fi
            RESOLVED_WEB="https://${HOSTNAME}"
          fi

          echo "Resolved Web -> $RESOLVED_WEB"
          echo "MAPAQ_WEB_URL=$RESOLVED_WEB" >> "$GITHUB_ENV"
          echo "TARGET_ENV_LABEL=${AZ_ENV}" >> "$GITHUB_ENV"

      - name: npm ci (Playwright project)
        working-directory: tests/ui
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (Chromium)
        working-directory: tests/ui
        # --with-deps installs the OS libs Playwright needs on Ubuntu runners.
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests/ui
        env:
          CI: "true"
        run: |
          set -uo pipefail

          # Pre-flight: warn if the home page does not respond, but let Playwright drive pass/fail.
          if curl -fsS --max-time 10 "$MAPAQ_WEB_URL/" -o /dev/null; then
            echo "Web tier reachable at $MAPAQ_WEB_URL"
          else
            echo "::warning::Pre-flight curl to $MAPAQ_WEB_URL/ failed."
          fi

          npx --no-install playwright test
          PLAYWRIGHT_EXIT=$?

          # Always publish the report bundle, regardless of pass/fail.
          mkdir -p "$REPORT_DIR"
          cp -r playwright-report  "$REPORT_DIR/" 2>/dev/null || true
          cp -r test-results       "$REPORT_DIR/" 2>/dev/null || true
          cp -r screenshots        "$REPORT_DIR/" 2>/dev/null || true

          echo "Playwright exit code: $PLAYWRIGHT_EXIT (per-test pass/fail decided by the JUnit publish step)"
          exit 0

      - name: Publish Playwright JUnit results to Checks tab
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/ui/test-results/junit.xml
          check_name: "Mapaq UI Tests (${{ inputs.azureEnvName }})"
          comment_mode: off
          fail_on: ${{ inputs.failOnTestErrors && 'test failures' || 'nothing' }}

      - name: Upload HTML + screenshots bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: ${{ env.REPORT_DIR }}
