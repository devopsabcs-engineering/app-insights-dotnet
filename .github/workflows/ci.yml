# Continuous integration: builds and tests the .NET solution, then validates
# Bicep templates with az deployment sub what-if. Runs on every PR and on push
# to main. The bicep job uses OIDC federated login (no client secrets).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  dotnet:
    name: dotnet build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # GitVersion needs full history (and tags) to compute the SemVer.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Compute the semantic version from git history (GitVersion.yml at repo
      # root → 1.0.0, then patch+1 per commit on main).
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Publish version to job summary
        run: echo "### Semantic version \`${{ steps.gitversion.outputs.semVer }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore Mapaq.sln

      - name: Build (warnings as errors)
        run: >-
          dotnet build Mapaq.sln --configuration Release --no-restore /warnaserror
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.fullSemVer }}

      - name: Test
        run: >-
          dotnet test Mapaq.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      # Merge per-project Cobertura outputs into a single HTML/MD report and a
      # combined Cobertura. The MarkdownSummaryGithub format is emitted as the
      # PR / run job summary so coverage is visible without downloading.
      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: always()
        run: >-
          reportgenerator
          -reports:${{ github.workspace }}/coverage/**/coverage.cobertura.xml
          -targetdir:${{ github.workspace }}/coverage/report
          "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub"

      - name: Publish coverage summary to job summary
        if: always()
        run: cat ${{ github.workspace }}/coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ${{ github.workspace }}/coverage/report

  bicep:
    name: bicep build + what-if
    runs-on: ubuntu-latest
    needs: dotnet
    environment: workshop-dev
    env:
      AZURE_LOCATION: canadacentral
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: bicep build
        run: |
          az bicep upgrade
          az bicep build --file infra/main.bicep

      - name: bicep what-if (subscription scope)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment sub what-if \
              --location "${AZURE_LOCATION}" \
              --template-file infra/main.bicep \
              --parameters infra/main.parameters.json \
              --parameters environmentName="${AZURE_ENV_NAME:-ci-whatif}" \
              --parameters location="${AZURE_LOCATION}" \
              --parameters sqlAdminLogin=azureSqlDBAdmins \
              --parameters sqlAdminPrincipalId=b817fa2d-6c4b-473b-b82c-1f405f5ef2d8 \
              --parameters sqlAdminPrincipalType=Group \
              --parameters apiImageTag=latest \
              --parameters webImageTag=latest \
              --parameters acrSku=Basic
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
