# GitHub Advanced Security — CodeQL code scanning + dependency review.
# Mirrors .azuredevops/pipelines/adv-sec.yml (which uses ADO's AdvancedSecurity
# CodeQL + Dependency Scanning tasks). On GitHub, dependency scanning is split
# between Dependabot alerts (always-on, repo Security tab) and the
# dependency-review-action which gates PRs on new vulnerable advisories.
#
# CodeQL needs to observe the compiler for compiled languages (C#). We do an
# explicit dotnet build with --no-incremental + /p:UseSharedCompilation=false so
# the CodeQL extractor sees every csc invocation; this matches the ADO pipeline
# rationale (the extractor would otherwise miss source on warm Roslyn build
# servers). JavaScript and Python are extracted from source and need no build.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — keeps the latest query suite running even when
    # no code changes land in a quiet week.
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript, python]
    env:
      DOTNET_VERSION: "10.0.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: CodeQL init (${{ matrix.language }})
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: dotnet restore
        if: matrix.language == 'csharp'
        run: dotnet restore Mapaq.sln

      # --no-incremental + /p:UseSharedCompilation=false defeat Roslyn's build-
      # server caching, which otherwise causes CodeQL to miss source files.
      - name: dotnet build (no-incremental, no-shared-compilation)
        if: matrix.language == 'csharp'
        run: |
          dotnet build Mapaq.sln \
            --configuration Release \
            --no-restore \
            --no-incremental \
            /p:UseSharedCompilation=false

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency_review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
