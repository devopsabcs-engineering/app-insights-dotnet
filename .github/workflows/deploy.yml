# Provisions infra and deploys application code via azd. Triggered automatically
# after a successful CI run on main, or manually via workflow_dispatch. Uses
# OIDC federated credentials (no secrets) and gates on the workshop-dev
# GitHub Environment for branch protection and reviewer approval.
name: deploy

on:
  workflow_dispatch:
    inputs:
      azureEnvName:
        description: "azd env name (defaults to dev-001)"
        required: false
        type: string
        default: dev-001
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  # contents: write lets the deploy job push the release git tag (v<SemVer>).
  contents: write

jobs:
  deploy:
    name: azd up
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: workshop-dev
      url: ${{ steps.azd.outputs.endpoint }}
    env:
      AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION:        ${{ vars.AZURE_LOCATION || 'canadaeast' }}
      AZURE_ENV_NAME:        ${{ inputs.azureEnvName || vars.AZURE_ENV_NAME || 'dev-001' }}
      SQL_ADMIN_LOGIN:       ${{ vars.SQL_ADMIN_LOGIN }}
      SQL_ADMIN_OBJECT_ID:   ${{ vars.SQL_ADMIN_OBJECT_ID }}
      SQL_ADMIN_GROUP_ID:    ${{ vars.SQL_ADMIN_GROUP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # GitVersion needs full history (and tags) to compute the SemVer.
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: azd auth login (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd provision + image build + restart
        id: azd
        run: |
          chmod +x infra/scripts/*.sh
          azd env new "$AZURE_ENV_NAME" \
            --no-prompt \
            --location "$AZURE_LOCATION" \
            --subscription "$AZURE_SUBSCRIPTION_ID" || true
          azd env select "$AZURE_ENV_NAME"
          azd env set SQL_ADMIN_LOGIN "$SQL_ADMIN_LOGIN"
          azd env set SQL_ADMIN_OBJECT_ID "$SQL_ADMIN_OBJECT_ID"

          # --- Container deploy: immutable SHA tag -> provision -> server-side build -> restart ---
          TAG="${{ github.sha }}"
          SEMVER="${{ steps.gitversion.outputs.semVer }}"
          azd env set API_IMAGE_TAG "$TAG"
          azd env set WEB_IMAGE_TAG "$TAG"

          # Provision creates ACR + UAMI AcrPull + sites (sites point at :$TAG; the restart below
          # makes them pull once the image exists).
          azd provision --no-prompt

          # Resolve registry + resource group from azd outputs (no hardcoded names).
          ACR_NAME="$(azd env get-value ACR_NAME)"
          RG="$(azd env get-value AZURE_RESOURCE_GROUP)"

          # Server-side build+push - no Docker daemon, no docker login (OIDC identity active).
          # The SemVer is baked into the binary (/p:Version) and image (OCI label + APP_VERSION
          # env) via the VERSION build arg, and pushed as an extra human-readable :$SEMVER tag
          # alongside the immutable :$TAG (git SHA) that the sites actually run.
          az acr build --registry "$ACR_NAME" --build-arg VERSION="$SEMVER" \
            --image "mapaq-api:$TAG" --image "mapaq-api:$SEMVER" --file src/Mapaq.Api/Dockerfile .
          az acr build --registry "$ACR_NAME" --build-arg VERSION="$SEMVER" \
            --image "mapaq-web:$TAG" --image "mapaq-web:$SEMVER" --file src/Mapaq.Web/Dockerfile .

          # Force both sites to pull the now-present image.
          api_site="$(az webapp list -g "$RG" --query "[?starts_with(name,'mapaq-api-')].name | [0]" -o tsv)"
          web_site="$(az webapp list -g "$RG" --query "[?starts_with(name,'mapaq-web-')].name | [0]" -o tsv)"
          az webapp restart -g "$RG" -n "$api_site"
          az webapp restart -g "$RG" -n "$web_site"

          endpoint=$(azd env get-values | grep -E '^WEB_URI=' | cut -d= -f2- | tr -d '"' || true)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Grant UAMI SQL access via Entra group
        run: |
          # Retrieve the UAMI principal ID from azd env outputs
          uami_principal_id=$(azd env get-value UAMI_PRINCIPAL_ID 2>/dev/null || \
            az identity show \
              --name "$(azd env get-value UAMI_NAME)" \
              --resource-group "$(azd env get-value AZURE_RESOURCE_GROUP)" \
              --query principalId -o tsv)

          # Add UAMI to the SQL admin Entra group (idempotent — ignores if already member)
          az ad group member add \
            --group "$SQL_ADMIN_GROUP_ID" \
            --member-id "$uami_principal_id" 2>/dev/null \
            || echo "UAMI already a member of SQL admin group (or insufficient permissions — verify manually)"

      - name: Tag the repo with the released version
        run: |
          # Stamp an annotated git tag v<SemVer> on the deployed commit for traceability.
          # Idempotent: skips if the tag already exists. Push uses the GITHUB_TOKEN
          # persisted by actions/checkout (contents: write grants push access).
          SEMVER="${{ steps.gitversion.outputs.semVer }}"
          TAG="v${SEMVER}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
